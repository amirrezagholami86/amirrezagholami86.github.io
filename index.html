<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>AMIRREZA • v501.0.0</title>
<style>
:root{--bg:#000;--panel:#101010;--line:#292929;--txt:#f5f5f5;--muted:#a8a8a8;--blue:#0095f6;--red:#ff3040}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Arial,system-ui,sans-serif}
button,input,textarea{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:680px;margin:auto;min-height:100vh}
.top{height:58px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#000e;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}
.logo{font-size:19px;font-weight:900;letter-spacing:1px}.ico{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%}.ico:active{background:#222}
svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page{display:none;min-height:calc(100vh - 120px);padding-bottom:75px}.page.active{display:block}
.stories{display:flex;gap:14px;overflow:auto;padding:14px 12px;border-bottom:1px solid var(--line)}
.story{min-width:66px;text-align:center;font-size:11px;cursor:pointer}.avatar{width:60px;height:60px;object-fit:cover;border-radius:50%;padding:2px;border:2px solid #d62976}.story small{display:block;margin-top:5px}
.card{border-bottom:1px solid var(--line);padding-bottom:10px}.phead{display:flex;align-items:center;gap:10px;padding:12px}.phead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.pmeta{flex:1}.pmeta small{display:block;color:var(--muted);margin-top:4px}
.media{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#111}.actions{display:flex;align-items:center;padding:6px 8px;gap:2px}.push{margin-right:auto}.liked{color:var(--red)!important}.count,.caption{padding:0 12px;font-size:14px}.caption{margin-top:7px;line-height:1.7}.muted{color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;height:62px;display:flex;justify-content:space-around;align-items:center;z-index:20;background:#000f;border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.nav button{flex:1;height:55px;display:grid;place-items:center}.nav button.on{color:#fff}.nav svg{width:24px;height:24px}
.searchbox{margin:14px;padding:12px;background:#1b1b1b;border-radius:12px;display:flex;gap:10px}.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{width:100%;aspect-ratio:1;object-fit:cover;background:#151515;cursor:pointer}
.profile{padding:18px}.profileTop{display:flex;gap:18px;align-items:center}.big{width:84px;height:84px;border-radius:50%;object-fit:cover}.stats{display:flex;gap:18px}.stats b,.stats small{display:block;text-align:center}.stats small{font-size:11px;color:var(--muted);margin-top:4px}.bio{margin-top:15px;line-height:1.8}.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:13px;color:var(--muted)}.tabs .sel{color:white;border-bottom:2px solid white}
.empty{padding:55px 20px;text-align:center;color:var(--muted);line-height:1.8}.note{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:13px;background:#0d0d0d}
.modal{position:fixed;inset:0;z-index:50;background:#000c;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;background:#111;border:1px solid #292929;border-radius:22px 22px 0 0;padding:18px}.field{width:100%;padding:12px;margin:7px 0;background:#1b1b1b;color:white;border:1px solid #303030;border-radius:12px;outline:none}.primary{padding:12px;border-radius:11px;background:var(--blue);color:white;font-weight:bold;width:100%;margin-top:8px}.secondary{padding:10px;border-radius:10px;background:#252525}
.comments{max-height:42vh;overflow:auto}.comment{padding:11px 0;border-bottom:1px solid #282828;line-height:1.7}.comment small{color:var(--muted)}
.chat{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}.chat img{width:52px;height:52px;border-radius:50%;object-fit:cover}.grow{flex:1;min-width:0}.chat small{display:block;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis}
.chatPage{display:none;height:calc(100dvh - 120px);flex-direction:column}.chatPage.active{display:flex}.chatHead{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.chatHead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.messages{flex:1;overflow:auto;padding:14px}.bubble{max-width:80%;width:max-content;padding:10px 13px;margin:7px 0;background:#202020;border-radius:17px;line-height:1.6;overflow-wrap:anywhere}.bubble.mine{margin-right:auto;background:#087be0}.bubble small{display:block;font-size:10px;opacity:.7;margin-top:3px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:24px;background:#171717;border:1px solid #303030;color:white;outline:none}.sendbtn{width:44px;border-radius:50%;background:var(--blue)}
.reel{height:calc(100dvh - 125px);max-height:850px;position:relative;background:#111}.reel img{width:100%;height:100%;object-fit:cover}.reelInfo{position:absolute;bottom:20px;right:14px;left:75px;text-shadow:0 1px 5px black}.reelActions{position:absolute;left:10px;bottom:20px;display:grid;gap:15px}.reelActions button{display:grid;justify-items:center;gap:4px}.toast{position:fixed;z-index:100;bottom:76px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:11px 17px;border-radius:24px;display:none;white-space:nowrap}.toast.show{display:block}
.settingsRow{padding:16px 5px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.settingsRow span{flex:1}.lang{display:flex;gap:6px}.lang button{padding:8px;border:1px solid #444;border-radius:8px}.lang .sel{background:white;color:black}
@media(min-width:700px){.nav{bottom:10px;border:1px solid var(--line);border-radius:18px;width:660px}.page{padding-bottom:90px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="ico" onclick="go('settings')" aria-label="Settings"><svg><use href="#gear"/></svg></button>
<b class="logo">AMIRREZA</b>
<div><button class="ico" onclick="openCreate()"><svg><use href="#plus"/></svg></button><button class="ico" onclick="go('notify')"><svg><use href="#heart"/></svg></button></div>
</header>
<main>
<section id="home" class="page active"><div id="stories" class="stories"></div><div id="feed"></div></section>
<section id="explore" class="page"><div class="searchbox"><svg><use href="#search"/></svg><input placeholder="جستجوی پست‌ها..." oninput="search(this.value)"></div><div id="exploreGrid" class="grid"></div></section>
<section id="reels" class="page"><div id="reelsBox"></div></section>
<section id="direct" class="page"><div class="searchbox"><svg><use href="#search"/></svg><input placeholder="جستجوی گفتگو..." oninput="renderChats(this.value)"></div><div id="chatList"></div></section>
<section id="profile" class="page">
<div class="profile"><div class="profileTop"><img class="big" src="profile.jpg"><div class="grow"><b>امیررضا غلامی</b><p class="muted">@amirrezagholami</p><div class="stats"><div><b id="pc">0</b><small>Posts</small></div><div><b id="fc">0</b><small>Followers</small></div><div><b>0</b><small>Following</small></div></div></div></div>
<div class="bio">Creator • Developer • Dreamer<br>Personal Space • v501.0.0</div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="editProfile()">Edit Profile</button><button class="secondary" onclick="shareProfile()">Share Profile</button></div></div>
<div class="tabs"><button class="sel" onclick="profileTab('posts',this)">Posts</button><button onclick="profileTab('reels',this)">Reels</button><button onclick="profileTab('saved',this)">Saved</button></div><div id="profileGrid" class="grid"></div>
</section>
<section id="notify" class="page"><div class="profile"><h2>Notifications</h2><div id="notifications"></div></div></section>
<section id="settings" class="page"><div class="profile"><h2>Settings</h2>
<div class="settingsRow"><span>Language / زبان</span><div class="lang"><button id="fa" onclick="setLang('fa')">فارسی</button><button id="en" onclick="setLang('en')">EN</button></div></div>
<div class="settingsRow"><span>Theme</span><b>Dark</b></div><div class="settingsRow" onclick="openCreate()"><span>Create content</span><svg><use href="#plus"/></svg></div>
<div class="settingsRow"><span>Local storage</span><b>Enabled</b></div><div class="settingsRow"><span>Version</span><b>501.0.0</b></div>
<div class="settingsRow" onclick="clearData()"><span style="color:var(--red)">Reset local data</span><b>›</b></div>
</div></section>
<section id="chat" class="chatPage"><div class="chatHead"><button class="ico" onclick="go('direct')"><svg><use href="#back"/></svg></button><img id="chatAvatar" src="profile.jpg"><div class="grow"><b id="chatName">Chat</b><small class="muted">Local conversation</small></div></div><div id="messages" class="messages"></div><div class="composer"><input id="msg" placeholder="پیام..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="sendbtn" onclick="sendMsg()"><svg><use href="#send"/></svg></button></div></section>
</main>
<nav class="nav">
<button class="on" data-page="home" onclick="go('home')"><svg><use href="#homeIcon"/></svg></button>
<button data-page="explore" onclick="go('explore')"><svg><use href="#search"/></svg></button>
<button onclick="openCreate()"><svg><use href="#plus"/></svg></button>
<button data-page="direct" onclick="go('direct')"><svg><use href="#send"/></svg></button>
<button data-page="profile" onclick="go('profile')"><svg><use href="#user"/></svg></button>
</nav>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="modalTitle">Create Post</h3><button class="ico" onclick="closeModal()"><svg><use href="#close"/></svg></button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<svg style="display:none"><defs>
<symbol id="homeIcon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5-8.8 10.2-8.8 10.2S3.2 13.8 3.2 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8z"/></symbol>
<symbol id="comment" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H5l-2 2 .7-4A8 8 0 1 1 20 11.5z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
<symbol id="save" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7 7 0 0 0 0-3l2-1.5-2-3-2.2 1a7 7 0 0 0-2.5-1.5L14 3h-4l-.3 2.5A7 7 0 0 0 7.2 7L5 6 3 9l2 1.5a7 7 0 0 0 0 3L3 15l2 3 2.2-1a7 7 0 0 0 2.5 1.5L10 21h4l.3-2.5a7 7 0 0 0 2.5-1.5l2.2 1 2-3z"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
</defs></svg>
<script>
'use strict';
const KEY='amirreza_space_v24';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
S.posts=Array.isArray(S.posts)?S.posts:[];
S.notifications=Array.isArray(S.notifications)?S.notifications:[];
S.chats=Array.isArray(S.chats)?S.chats:[];
if(!S.chats.length)S.chats=[{id:'amirreza',name:'امیررضا غلامی',handle:'@amirrezagholami',avatar:'profile.jpg',messages:[]}];
S.posts.forEach(p=>{if(!Array.isArray(p.comments))p.comments=[];if(typeof p.liked!=='boolean')p.liked=false});
S.saved=Array.isArray(S.saved)?S.saved:[];
S.followers=S.followers||0;S.lang=S.lang||'fa';
let currentChat=null,profileMode='posts',storyIndex=0;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const img=p=>esc(p.image||('https://picsum.photos/600?random='+p.id));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('فضای ذخیره‌سازی پر شده است')}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function go(id){document.querySelectorAll('.page,.chatPage').forEach(x=>x.classList.remove('active'));$(id)?.classList.add('active');document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===id));render();window.scrollTo(0,0)}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function openCreate(){openModal('Create',`<div class="lang"><button onclick="createType='post';toast('Post selected')">Post</button><button onclick="createType='story';toast('Story selected')">Story</button><button onclick="createType='reel';toast('Reel selected')">Reel</button></div><textarea id="newText" class="field" rows="4" placeholder="کپشن یا متن..."></textarea><input id="newImage" class="field" placeholder="آدرس تصویر (اختیاری)"><button class="primary" onclick="publish()">Publish</button>`);window.createType='post'}
function publish(){const text=$('newText')?.value.trim()||'',image=$('newImage')?.value.trim()||'',type=window.createType||'post';if(!text&&!image)return toast('متن یا آدرس تصویر وارد کن');if(type==='story'){S.stories=S.stories||[];S.stories.unshift({id:Date.now(),text,image,time:Date.now()});S.notifications.unshift('استوری جدید ایجاد شد')}else{S.posts.unshift({id:Date.now(),text,image,type,likes:0,liked:false,comments:[],time:new Date().toLocaleString('fa-IR')});S.notifications.unshift(type==='reel'?'ریلز جدید منتشر شد':'پست جدید منتشر شد')}save();closeModal();render();go('home');toast('منتشر شد ✓')}
function postHTML(p){return `<article class="card" id="post-${p.id}"><div class="phead"><img src="profile.jpg"><div class="pmeta"><b>amirrezagholami</b><small>امیررضا غلامی · ${esc(p.time||'')}</small></div><button class="ico" onclick="postOptions(${p.id})">•••</button></div><img class="media" src="${img(p)}" ondblclick="like(${p.id})" onerror="this.src='https://picsum.photos/600?random=${p.id}'"><div class="actions"><button class="ico ${p.liked?'liked':''}" onclick="like(${p.id})"><svg><use href="#heart"/></svg></button><button class="ico" onclick="comments(${p.id})"><svg><use href="#comment"/></svg></button><button class="ico" onclick="sharePost(${p.id})"><svg><use href="#send"/></svg></button><button class="ico push ${S.saved.includes(p.id)?'liked':''}" onclick="savePost(${p.id})"><svg><use href="#save"/></svg></button></div><div class="count"><b>${p.likes||0} likes</b></div><div class="caption"><b>amirrezagholami</b> ${esc(p.text||'')}</div><button style="padding:9px 12px;color:#aaa" onclick="comments(${p.id})">مشاهده نظرات (${p.comments.length})</button></article>`}
function render(){const p=S.posts;renderStories();$('feed').innerHTML=p.length?p.map(postHTML).join(''):`<div class="empty"><h2>Welcome to AMIRREZA</h2>هنوز پستی منتشر نکردی.<br>برای شروع روی + بزن.</div>`;$('exploreGrid').innerHTML=p.length?p.map(x=>`<img class="tile" src="${img(x)}" onclick="openPost(${x.id})">`).join(''):`<div class="empty" style="grid-column:1/-1">هنوز پستی وجود ندارد</div>`;$('pc').textContent=p.length;$('fc').textContent=S.followers;$('notifications').innerHTML=S.notifications.length?S.notifications.map(n=>`<div class="note">${esc(n)}</div>`).join(''):`<div class="empty">اعلانی وجود ندارد</div>`;renderChats();renderProfile();renderReels()}
function renderStories(){const stories=S.stories||[];$('stories').innerHTML=`<div class="story" onclick="openCreate()"><img class="avatar" src="profile.jpg"><small>استوری شما +</small></div>`+stories.map((s,i)=>`<div class="story" onclick="viewStory(${i})"><img class="avatar" src="${esc(s.image||'profile.jpg')}"><small>${esc((s.text||'استوری').slice(0,12))}</small></div>`).join('')}
function viewStory(i){const arr=S.stories||[];const s=arr[i];if(!s)return toast('هنوز استوری‌ای وجود ندارد');openModal('Story',`${s.image?`<img src="${esc(s.image)}" style="width:100%;max-height:55vh;object-fit:contain">`:''}<p style="line-height:1.8">${esc(s.text)}</p><div style="display:flex;gap:8px"><button class="secondary" onclick="viewStory(${Math.max(0,i-1)})">قبلی</button><button class="primary" onclick="viewStory(${Math.min(arr.length-1,i+1)})">بعدی</button></div>`)}
function like(id){const p=S.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));save();render()}
function comments(id){const p=S.posts.find(x=>x.id===id);if(!p)return;openModal('نظرات',`<div class="comments" id="commentList">${p.comments.map((c,i)=>`<div class="comment"><b>${esc(c.user||'کاربر')}</b> ${esc(c.text)} <button onclick="deleteComment(${id},${i})" style="color:#f55">حذف</button></div>`).join('')||'<p class="muted">هنوز نظری ثبت نشده.</p>'}</div><input id="commentInput" class="field" placeholder="نظر خودت را بنویس..." onkeydown="if(event.key==='Enter')addComment(${id})"><button class="primary" onclick="addComment(${id})">ثبت نظر</button>`)}
function addComment(id){const p=S.posts.find(x=>x.id===id),el=$('commentInput');if(!p||!el||!el.value.trim())return;p.comments.push({user:'amirrezagholami',text:el.value.trim()});S.notifications.unshift('نظر جدید ثبت شد');save();comments(id);render()}
function deleteComment(id,i){const p=S.posts.find(x=>x.id===id);if(!p)return;p.comments.splice(i,1);save();comments(id);render()}
function savePost(id){if(S.saved.includes(id))S.saved=S.saved.filter(x=>x!==id);else S.saved.push(id);save();render();toast(S.saved.includes(id)?'ذخیره شد':'از ذخیره‌ها حذف شد')}
function sharePost(id){const url=location.href.split('#')[0]+'#post-'+id;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('لینک کپی شد')).catch(()=>toast(url));else toast(url)}
function postOptions(id){openModal('Post options',`<button class="primary" onclick="deletePost(${id})">حذف پست</button><button class="primary" style="background:#333" onclick="closeModal()">انصراف</button>`)}
function deletePost(id){S.posts=S.posts.filter(p=>p.id!==id);S.saved=S.saved.filter(x=>x!==id);save();closeModal();render();toast('پست حذف شد')}
function openPost(id){go('home');setTimeout(()=>$('post-'+id)?.scrollIntoView({behavior:'smooth'}),50)}
function search(v){const q=v.toLowerCase().trim(),p=S.posts.filter(x=>(x.text||'').toLowerCase().includes(q));$('exploreGrid').innerHTML=p.map(x=>`<img class="tile" src="${img(x)}" onclick="openPost(${x.id})">`).join('')||`<div class="empty" style="grid-column:1/-1">نتیجه‌ای پیدا نشد</div>`}
function profileTab(mode,btn){profileMode=mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');renderProfile()}
function renderProfile(){const list=profileMode==='saved'?S.posts.filter(p=>S.saved.includes(p.id)):profileMode==='reels'?S.posts.filter(p=>p.type==='reel'):S.posts.filter(p=>p.type!=='reel');$('profileGrid').innerHTML=list.map(p=>`<img class="tile" src="${img(p)}" onclick="openPost(${p.id})">`).join('')||`<div class="empty" style="grid-column:1/-1">محتوایی برای نمایش نیست</div>`}
function renderReels(){const p=S.posts.filter(x=>x.type==='reel');$('reelsBox').innerHTML=p.length?p.map(x=>`<div class="reel"><img src="${img(x)}"><div class="reelInfo"><b>@amirrezagholami</b><p>${esc(x.text)}</p></div><div class="reelActions"><button onclick="like(${x.id})"><svg><use href="#heart"/></svg><small>${x.likes||0}</small></button><button onclick="comments(${x.id})"><svg><use href="#comment"/></svg></button><button onclick="sharePost(${x.id})"><svg><use href="#send"/></svg></button></div></div>`).join(''):`<div class="empty">هنوز ریلزی منتشر نشده. هنگام ساخت محتوا گزینه Reel را انتخاب کن.</div>`}
function renderChats(filter=''){const q=filter.toLowerCase();$('chatList').innerHTML=S.chats.filter(c=>(c.name+c.handle).toLowerCase().includes(q)).map(c=>`<div class="chat" onclick="openChat('${esc(c.id)}')"><img src="${esc(c.avatar||'profile.jpg')}"><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.messages?.at(-1)?.text||'شروع گفتگو')}</small></div></div>`).join('')||'<div class="empty">گفتگویی پیدا نشد</div>'}
function openChat(id){currentChat=S.chats.find(c=>String(c.id)===String(id));if(!currentChat)return;$('chatName').textContent=currentChat.name;$('chatAvatar').src=currentChat.avatar||'profile.jpg';go('chat');renderMessages()}
function renderMessages(){if(!currentChat)return;$('messages').innerHTML=currentChat.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${esc(m.time||'')}</small></div>`).join('')||'<div class="empty">هنوز پیامی وجود ندارد</div>';$('messages').scrollTop=$('messages').scrollHeight}
function sendMsg(){const el=$('msg'),text=el.value.trim();if(!text||!currentChat)return;currentChat.messages.push({text,mine:true,time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})});save();el.value='';renderMessages();renderChats()}
function editProfile(){openModal('ویرایش پروفایل',`<input id="editName" class="field" value="${esc(S.displayName||'امیررضا غلامی')}" placeholder="نام"><input id="editBio" class="field" value="${esc(S.bio||'Creator • Developer • Dreamer')}" placeholder="بیوگرافی"><button class="primary" onclick="saveProfile()">ذخیره</button>`)}
function saveProfile(){S.displayName=$('editName').value.trim();S.bio=$('editBio').value.trim();save();document.querySelector('.profileTop b').textContent=S.displayName||'امیررضا غلامی';document.querySelector('.bio').textContent=S.bio||'';closeModal();toast('پروفایل ذخیره شد')}
function shareProfile(){const url=location.href.split('#')[0];if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('لینک کپی شد')).catch(()=>toast(url));else toast(url)}
function setLang(l){S.lang=l;save();document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';$('fa').classList.toggle('sel',l==='fa');$('en').classList.toggle('sel',l==='en');toast(l==='fa'?'زبان فارسی انتخاب شد':'English selected')}
function clearData(){if(confirm('همه اطلاعات محلی این سایت پاک شود؟')){localStorage.removeItem(KEY);location.reload()}}
$('fa').classList.toggle('sel',S.lang==='fa');$('en').classList.toggle('sel',S.lang==='en');document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';save();render();
</script>
</body>
