
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>AMIRREZA • v502</title><style>
:root{--b:#000;--p:#111;--l:#292929;--t:#f5f5f5;--m:#aaa;--a:#0095f6;--d:#ed4956}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px Arial,system-ui}button,input,textarea{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh}.top{height:58px;position:sticky;top:0;z-index:10;background:#000e;backdrop-filter:blur(14px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.logo{font-weight:900;letter-spacing:1px}.ico{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.page{display:none;min-height:calc(100vh - 120px);padding-bottom:72px}.page.active{display:block}.stories{display:flex;gap:14px;overflow:auto;padding:14px;border-bottom:1px solid var(--l)}.story{min-width:62px;text-align:center;font-size:11px;cursor:pointer}.avatar{width:58px;height:58px;border:2px solid #d6249f;border-radius:50%;padding:2px;object-fit:cover}.story small{display:block;margin-top:5px}.card{border-bottom:1px solid var(--l);padding-bottom:10px}.phead{display:flex;align-items:center;gap:10px;padding:12px}.phead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.pmeta{flex:1}.pmeta small{display:block;color:var(--m);margin-top:4px}.media{width:100%;aspect-ratio:1;object-fit:cover;background:#111;display:block}.actions{display:flex;align-items:center;padding:7px 9px}.push{margin-right:auto}.count,.caption{padding:0 12px;font-size:14px}.caption{margin-top:7px;line-height:1.7;overflow-wrap:anywhere}.muted,small{color:var(--m)}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;height:64px;display:flex;align-items:center;justify-content:space-around;background:#000f;border-top:1px solid var(--l)}.nav button{width:19%;height:54px}.nav svg{width:24px;height:24px}.searchbox{margin:14px;padding:12px;background:#1b1b1b;border-radius:12px;display:flex;gap:10px;align-items:center}.searchbox input,.composer input{width:100%;background:none;border:0;outline:0;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{width:100%;aspect-ratio:1;object-fit:cover;background:#151515;cursor:pointer}.profile{padding:18px}.profileTop{display:flex;gap:18px;align-items:center}.big{width:84px;height:84px;border-radius:50%;object-fit:cover}.stats{display:flex;gap:18px}.stats b,.stats small{display:block;text-align:center}.bio{line-height:1.8;margin-top:14px;overflow-wrap:anywhere}.tabs{display:flex;border-block:1px solid var(--l);margin-top:18px}.tabs button{flex:1;padding:13px;color:var(--m)}.tabs .sel{color:white;border-bottom:2px solid white}.empty{padding:40px 18px;text-align:center;color:var(--m)}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid var(--l);border-radius:22px 22px 0 0;padding:18px}.field{width:100%;padding:12px;margin:7px 0;background:#1b1b1b;color:white;border:1px solid #333;border-radius:12px}.primary{padding:12px;border-radius:12px;background:var(--a);color:white;font-weight:bold;width:100%;margin-top:8px}.chat{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}.chat img{width:52px;height:52px;border-radius:50%;object-fit:cover}.grow{flex:1}.chat small{display:block;margin-top:5px}.chatPage{height:calc(100dvh - 58px);display:none;flex-direction:column}.chatPage.active{display:flex}.chatHead{height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--l)}.chatHead img{width:36px;height:36px;border-radius:50%;object-fit:cover}.messages{flex:1;overflow:auto;padding:12px}.bubble{max-width:78%;padding:10px 13px;margin:6px 0;border-radius:18px;background:#222;line-height:1.6;overflow-wrap:anywhere}.bubble.mine{margin-right:auto;background:var(--a)}.bubble small{display:block;font-size:10px}.composer{display:flex;gap:8px;padding:9px;border-top:1px solid var(--l)}.composer input{background:#171717;border:1px solid #333;border-radius:22px;padding:10px 14px}.sendbtn{background:var(--a);border-radius:50%;width:44px}.reel{height:calc(100dvh - 130px);min-height:420px;position:relative;background:#111}.reel img{width:100%;height:100%;object-fit:cover}.reelInfo{position:absolute;bottom:18px;right:14px;left:70px;text-shadow:0 1px 5px #000}.reelActions{position:absolute;bottom:18px;left:10px;display:grid;gap:15px}.reelActions button{display:grid;justify-items:center;gap:3px}.settingsRow{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--l);cursor:pointer}.settingsRow span{flex:1}.lang{display:flex;gap:6px}.lang button{padding:8px;border:1px solid #333;border-radius:9px}.note{padding:13px;margin:10px 0;border:1px solid var(--l);border-radius:12px}.toast{display:none;position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:white;color:black;padding:10px 16px;border-radius:20px;z-index:100;max-width:90%;text-align:center}.toast.show{display:block}@media(min-width:700px){.nav{bottom:10px;border:1px solid var(--l);border-radius:18px;width:660px}.page{padding-bottom:90px}}
</style></head><body><div class="app"><header class="top"><button class="ico" onclick="go('settings')">⚙</button><b class="logo">AMIRREZA</b><div><button class="ico" onclick="openCreate()">＋</button><button class="ico" onclick="go('notify')">♡</button></div></header><main>
<section id="home" class="page active"><div id="stories" class="stories"></div><div id="feed"></div></section>
<section id="explore" class="page"><div class="searchbox">⌕ <input placeholder="جستجو / Search" oninput="search(this.value)"></div><div id="exploreGrid" class="grid"></div></section>
<section id="reels" class="page"><div id="reelsBox"></div></section>
<section id="direct" class="page"><div class="searchbox"><input placeholder="جستجوی گفتگو" oninput="chatSearch(this.value)"></div><div id="chatList"></div><button class="primary" style="margin:14px;width:calc(100% - 28px)" onclick="newChat()">＋ گفتگوی جدید</button></section>
<section id="profile" class="page"><div class="profile"><div class="profileTop"><img class="big" src="profile.jpg" onerror="this.src=FALLBACK"><div><h2 id="displayName" style="margin:0">امیررضا غلامی</h2><p class="muted">@amirrezagholami</p><div class="stats"><div><b id="pc">0</b><small>Posts</small></div><div><b id="fc">0</b><small>Followers</small></div><div><b id="following">0</b><small>Following</small></div></div></div></div><div class="bio" id="bio">Creator • Developer • Dreamer</div><button class="primary" onclick="editProfile()">ویرایش پروفایل</button><button class="primary" style="background:#222" onclick="shareProfile()">اشتراک‌گذاری پروفایل</button></div><div class="tabs"><button class="sel" onclick="profileTab('posts',this)">Posts</button><button onclick="profileTab('reels',this)">Reels</button><button onclick="profileTab('saved',this)">Saved</button></div><div id="profileGrid" class="grid"></div></section>
<section id="notify" class="page"><div class="profile"><h2>Notifications</h2><div id="notifications"></div></div></section>
<section id="settings" class="page"><div class="profile"><h2>Settings</h2><div class="settingsRow"><span>Language</span><div class="lang"><button id="fa" onclick="setLang('fa')">فارسی</button><button id="en" onclick="setLang('en')">EN</button></div></div><div class="settingsRow"><span>Dark mode</span><b>ON</b></div><div class="settingsRow" onclick="openCreate()"><span>Create content</span><b>＋</b></div><div class="settingsRow" onclick="go('notify')"><span>Notifications</span><b>›</b></div><div class="settingsRow"><span>About</span><b>v502</b></div><div class="settingsRow" onclick="clearData()"><span style="color:var(--d)">Reset local data</span><b>›</b></div></div></section>
<section id="chat" class="chatPage"><div class="chatHead"><button class="ico" onclick="go('direct')">‹</button><img id="chatAvatar" src="profile.jpg"><div class="grow"><b id="chatName">Chat</b><small style="display:block">Local conversation</small></div></div><div id="messages" class="messages"></div><div class="composer"><input id="msg" placeholder="پیام..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="sendbtn" onclick="sendMsg()">➤</button></div></section>
</main><nav class="nav"><button onclick="go('home')">⌂</button><button onclick="go('explore')">⌕</button><button onclick="openCreate()">＋</button><button onclick="go('direct')">➤</button><button onclick="go('profile')">♙</button></nav></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="mt">Create</h3><button class="ico" onclick="closeModal()">✕</button></div><div style="display:flex;gap:7px"><button class="field" onclick="setType('post')">Post</button><button class="field" onclick="setType('story')">Story</button><button class="field" onclick="setType('reel')">Reel</button></div><textarea id="postText" class="field" rows="4" placeholder="کپشن / Caption"></textarea><input id="postImage" class="field" placeholder="Image URL (اختیاری)"><button class="primary" onclick="publish()">Publish</button></div></div><div id="toast" class="toast"></div>
<script>
const KEY='amirreza_space_v24',FALLBACK='https://picsum.photos/200?random=9';let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{S={}}S.posts=Array.isArray(S.posts)?S.posts:[];S.notifications=Array.isArray(S.notifications)?S.notifications:[];S.chats=Array.isArray(S.chats)?S.chats:[{id:'amirreza',name:'امیررضا غلامی',handle:'@amirrezagholami',avatar:'profile.jpg',messages:[]}];S.saved=Array.isArray(S.saved)?S.saved:[];S.followers=Number(S.followers)||0;S.following=Number(S.following)||0;S.lang=S.lang||'fa';S.posts.forEach(p=>{p.comments=Array.isArray(p.comments)?p.comments:[];p.likes=Number(p.likes)||0});let currentChat=null,createType='post',profileMode='posts';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(S)),img=p=>esc(p.image||FALLBACK),time=()=>new Date().toLocaleTimeString(S.lang==='fa'?'fa-IR':'en-US',{hour:'2-digit',minute:'2-digit'});
function go(id){document.querySelectorAll('.page,.chatPage').forEach(x=>x.classList.remove('active'));$(id)?.classList.add('active');render();scrollTo(0,0)}
function render(){let p=S.posts;$('stories').innerHTML=['امیررضا','دوستان','نزدیکان','＋'].map((n,i)=>`<div class="story" onclick="${i===0?"go('profile')":"openCreate('story')"}"><img class="avatar" src="profile.jpg" onerror="this.src=FALLBACK"><small>${n}</small></div>`).join('');$('feed').innerHTML=p.length?p.map(postHTML).join(''):'<div class="empty"><h2>Welcome to AMIRREZA</h2><p>هنوز پستی ساخته نشده؛ از + شروع کن.</p></div>';$('exploreGrid').innerHTML=p.map(x=>`<img class="tile" src="${img(x)}" onclick="viewPost(${x.id})">`).join('');$('pc').textContent=p.length;$('fc').textContent=S.followers;$('following').textContent=S.following;$('notifications').innerHTML=S.notifications.map(n=>`<div class="note">${esc(n)}</div>`).join('')||'<div class="empty">اعلانی وجود ندارد</div>';$('displayName').textContent=S.displayName||'امیررضا غلامی';$('bio').textContent=S.bio||'Creator • Developer • Dreamer';renderChats();profileTab(profileMode,document.querySelector('.tabs button.sel'));let r=p.find(x=>x.type==='reel')||p[0];$('reelsBox').innerHTML=r?`<div class="reel"><img src="${img(r)}"><div class="reelInfo"><b>@amirrezagholami</b><div>${esc(r.text)}</div></div><div class="reelActions"><button onclick="like(${r.id})">♡<small>${r.likes} likes</small></button><button onclick="comments(${r.id})">☏</button><button onclick="share(${r.id})">➤</button></div></div>`:'<div class="empty">هنوز ریلزی نیست</div>'}
function postHTML(p){return `<article class="card" id="post-${p.id}"><div class="phead"><img src="profile.jpg" onerror="this.src=FALLBACK"><div class="pmeta"><b>${esc(S.username||'amirrezagholami')}</b><small>امیررضا غلامی · ${esc(p.time||'')}</small></div><button class="ico" onclick="postMenu(${p.id})">•••</button></div>${p.image?`<img class="media" src="${img(p)}" ondblclick="like(${p.id})" onerror="this.style.display='none'">`:`<div class="media" style="display:grid;place-items:center;padding:24px;overflow-wrap:anywhere">${esc(p.text)}</div>`}<div class="actions"><button class="ico" onclick="like(${p.id})">♡</button><button class="ico" onclick="comments(${p.id})">☏</button><button class="ico" onclick="share(${p.id})">➤</button><button class="ico push" onclick="savePost(${p.id})">${S.saved.includes(p.id)?'▣':'▢'}</button></div><div class="count"><b>${p.likes} likes</b></div><div class="caption"><b>${esc(S.username||'amirrezagholami')}</b> ${esc(p.text)}</div>${p.comments.length?`<div class="caption muted">${p.comments.length} comments <button onclick="comments(${p.id})">View</button></div>`:''}</article>`}
function openCreate(type='post'){createType=type;$('postText').value='';$('postImage').value='';$('mt').textContent=type.toUpperCase();$('modal').classList.add('show')}function setType(t){createType=t;$('mt').textContent=t.toUpperCase()}function closeModal(){$('modal').classList.remove('show')}function publish(){let text=$('postText').value.trim(),image=$('postImage').value.trim();if(!text&&!image)return toast('متن یا لینک تصویر وارد کن');if(image&&!/^https?:\/\//i.test(image))return toast('لینک تصویر باید با http یا https شروع شود');S.posts.unshift({id:Date.now(),text,image,type:createType,likes:0,comments:[],time:new Date().toLocaleString('fa-IR')});S.notifications.unshift('محتوای جدید منتشر شد');save();closeModal();go(createType==='reel'?'reels':'home');toast('منتشر شد ✓')}
function like(id){let p=S.posts.find(x=>x.id===id);if(p){p.likes++;save();render()}}function savePost(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();render();toast(S.saved.includes(id)?'ذخیره شد ✓':'از ذخیره‌ها حذف شد')}function share(id){let url=location.href.split('#')[0]+(typeof id==='number'?'#post-'+id:'#profile');if(navigator.share)navigator.share({title:'AMIRREZA',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('لینک کپی شد')).catch(()=>toast(url));else prompt('لینک را کپی کن',url)}function search(v){let a=S.posts.filter(p=>(p.text||'').toLowerCase().includes(v.toLowerCase()));$('exploreGrid').innerHTML=a.map(x=>`<img class="tile" src="${img(x)}" onclick="viewPost(${x.id})">`).join('')||'<div class="empty" style="grid-column:1/-1">نتیجه‌ای پیدا نشد</div>'}
function viewPost(id){go('home');setTimeout(()=>$('post-'+id)?.scrollIntoView({behavior:'smooth'}),80)}function postMenu(id){let p=S.posts.find(x=>x.id===id);if(!p)return;if(confirm('این پست حذف شود؟')){S.posts=S.posts.filter(x=>x.id!==id);S.saved=S.saved.filter(x=>x!==id);save();render();toast('پست حذف شد')}}function comments(id){let p=S.posts.find(x=>x.id===id);if(!p)return;let c=prompt('نظر خود را بنویسید');if(c?.trim()){p.comments.push(c.trim());S.notifications.unshift('نظر جدید ثبت شد');save();render();toast('نظر ثبت شد')}}
function profileTab(mode,btn){profileMode=mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('sel',x===btn));let p=S.posts.filter(x=>mode==='reels'?x.type==='reel':mode==='saved'?S.saved.includes(x.id):x.type!=='reel');$('profileGrid').innerHTML=p.map(x=>`<img class="tile" src="${img(x)}" onclick="viewPost(${x.id})">`).join('')||'<div class="empty" style="grid-column:1/-1">محتوایی وجود ندارد</div>'}
function editProfile(){let n=prompt('نام نمایشی',S.displayName||'امیررضا غلامی');if(n===null)return;let b=prompt('Bio',S.bio||'Creator • Developer • Dreamer');if(b===null)return;S.displayName=n.trim()||'امیررضا غلامی';S.bio=b;save();render();toast('پروفایل به‌روزرسانی شد')}function shareProfile(){share('profile')}
function renderChats(filter=''){let a=S.chats.filter(c=>(c.name+' '+c.handle).toLowerCase().includes(filter.toLowerCase()));$('chatList').innerHTML=a.map(c=>`<div class="chat" onclick="openChat('${esc(c.id)}')"><img src="${esc(c.avatar||'profile.jpg')}" onerror="this.src=FALLBACK"><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.messages?.at(-1)?.text||'شروع گفتگو')}</small></div><small>${esc(c.messages?.at(-1)?.time||'')}</small></div>`).join('')||'<div class="empty">گفتگویی وجود ندارد</div>'}function chatSearch(v){renderChats(v)}function newChat(){let name=prompt('نام مخاطب');if(!name?.trim())return;let id='chat_'+Date.now();S.chats.push({id,name:name.trim(),handle:'',avatar:'profile.jpg',messages:[]});save();renderChats();openChat(id)}function openChat(id){currentChat=S.chats.find(c=>c.id===id);if(!currentChat)return;currentChat.messages=Array.isArray(currentChat.messages)?currentChat.messages:[];$('chatName').textContent=currentChat.name;$('chatAvatar').src=currentChat.avatar||'profile.jpg';go('chat');renderMessages()}function renderMessages(){if(!currentChat)return;$('messages').innerHTML=currentChat.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${esc(m.time)}</small></div>`).join('')||'<div class="empty">هنوز پیامی نیست</div>';$('messages').scrollTop=$('messages').scrollHeight}function sendMsg(){let el=$('msg'),text=el.value.trim();if(!text||!currentChat)return;currentChat.messages.push({text,mine:true,time:time()});S.notifications.unshift('پیام در گفتگوی محلی ذخیره شد');save();el.value='';renderMessages()}
function setLang(l){S.lang=l;save();document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';$('fa').classList.toggle('sel',l==='fa');$('en').classList.toggle('sel',l==='en')}function clearData(){if(confirm('تمام اطلاعات محلی حذف شود؟')){localStorage.removeItem(KEY);location.reload()}}function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>x.classList.remove('show'),2000)}setLang(S.lang);render();
</script></body></html>
