<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Amirreza • v500.0.0</title><style>
:root{--bg:#000;--panel:#0b0b0b;--panel2:#141414;--line:#262626;--txt:#f5f5f5;--muted:#a8a8a8;--accent:#0095f6;--danger:#ed4956;--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,system-ui,sans-serif}button,input,textarea{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;background:#000}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#000e;backdrop-filter:blur(14px);z-index:10}.logo{font-weight:900;letter-spacing:.5px}.top .acts,.nav{display:flex;align-items:center;gap:6px}.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}.ico:hover{background:#171717}.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.page{display:none;min-height:calc(100vh - 112px);padding-bottom:70px}.page.active{display:block}.stories{display:flex;gap:14px;overflow:auto;padding:14px 12px;border-bottom:1px solid var(--line)}.story{min-width:66px;text-align:center;font-size:11px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #d6249f;padding:2px}.story small{display:block;margin-top:5px;color:#ddd}.card{border-bottom:1px solid var(--line);padding-bottom:10px}.phead{display:flex;align-items:center;gap:10px;padding:12px}.phead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.pmeta{flex:1}.pmeta b{font-size:14px}.pmeta small{display:block;color:var(--muted);margin-top:3px}.media{width:100%;aspect-ratio:1/1;background:#111;object-fit:cover;display:block}.actions{display:flex;align-items:center;padding:8px 10px;gap:2px}.actions .push{margin-right:auto}.count,.caption{padding:0 12px;font-size:14px}.caption{margin-top:7px;line-height:1.7}.muted{color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:680px;width:100%;height:64px;background:#000f;border-top:1px solid var(--line);justify-content:space-around;z-index:20;backdrop-filter:blur(16px)}.nav button{width:18%;height:54px;display:grid;place-items:center}.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav .on{color:#fff}.searchbox{margin:14px;padding:12px 14px;background:#1b1b1b;border-radius:12px;border:1px solid transparent;display:flex;gap:10px}.searchbox input{width:100%;background:none;border:0;outline:0;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1;background:#151515;object-fit:cover;width:100%}.profile{padding:18px}.profileTop{display:flex;gap:20px;align-items:center}.profileTop .big{width:88px;height:88px;border-radius:50%;object-fit:cover}.stats{display:flex;gap:20px}.stats b{display:block;text-align:center}.stats small{color:var(--muted)}.bio{margin-top:15px;line-height:1.7}.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}.tabs button{flex:1;padding:13px;color:var(--muted)}.tabs .sel{color:#fff;border-bottom:2px solid #fff}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #282828;border-radius:22px 22px 0 0;padding:18px}.sheet h3{margin:4px 0 18px}.field{width:100%;background:#1b1b1b;border:1px solid #303030;color:#fff;border-radius:12px;padding:12px;margin:7px 0;outline:0}.primary{width:100%;padding:12px;border-radius:12px;background:#0095f6;color:#fff;font-weight:800;margin-top:8px}.danger{color:var(--danger)}.chatList{padding:6px 0}.chat{display:flex;gap:12px;align-items:center;padding:12px 16px}.chat:hover{background:#111}.chat img{width:54px;height:54px;border-radius:50%;object-fit:cover}.chat .grow{flex:1}.chat small{color:var(--muted)}.chatPage{height:calc(100vh - 58px);padding-bottom:0;display:none;flex-direction:column}.chatPage.active{display:flex}.chatHead{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:8px}.chatHead img{width:36px;height:36px;border-radius:50%;object-fit:cover}.messages{flex:1;overflow:auto;padding:16px 12px}.bubble{max-width:78%;padding:10px 13px;margin:6px 0;border-radius:18px;background:#202020;line-height:1.6;word-break:break-word}.bubble.mine{margin-right:auto;background:#0095f6}.bubble small{display:block;font-size:9px;opacity:.65;margin-top:3px}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid var(--line);background:#000}.composer input{flex:1;background:#171717;border:1px solid #2a2a2a;border-radius:22px;padding:10px 14px;color:#fff;outline:0}.sendbtn{width:44px;border-radius:50%;background:#0095f6;display:grid;place-items:center}.reel{height:calc(100vh - 112px);position:relative;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.reel img{width:100%;height:100%;object-fit:cover}.reelInfo{position:absolute;bottom:18px;right:14px;left:74px;text-shadow:0 1px 5px #000}.reelActions{position:absolute;left:10px;bottom:18px;display:grid;gap:14px}.reelActions button{display:grid;justify-items:center;gap:3px}.reelActions svg{width:28px;height:28px}.settingsRow{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}.settingsRow svg{width:22px}.settingsRow span{flex:1}.badge{background:#ed4956;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}.lang{display:flex;gap:8px}.lang button{padding:8px 12px;border:1px solid #333;border-radius:10px}.lang .sel{background:#fff;color:#000}.note{margin:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d0d0d}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;display:none;z-index:100}.toast.show{display:block}.hide{display:none!important}@media(min-width:700px){.nav{border:1px solid var(--line);border-radius:18px;bottom:12px;width:660px}.page{padding-bottom:90px}}
</style></head><body><div class="app">
<header class="top"><button class="ico" onclick="go('settings')" aria-label="settings"><svg><use href="#gear"/></svg></button><b class="logo">AMIRREZA</b><div class="acts"><button class="ico" onclick="openCreate()"><svg><use href="#plus"/></svg></button><button class="ico" onclick="go('notify')"><svg><use href="#heart"/></svg><span id="nb"></span></button></div></header>
<main>
<section id="home" class="page active"><div class="stories" id="stories"></div><div id="feed"></div></section>
<section id="explore" class="page"><div class="searchbox"><svg width="20"><use href="#search"/></svg><input id="q" placeholder="جستجو / Search" oninput="search(this.value)"></div><div class="grid" id="exploreGrid"></div></section>
<section id="reels" class="page"><div id="reelsBox"></div></section>
<section id="direct" class="page"><div class="searchbox"><svg width="20"><use href="#search"/></svg><input placeholder="جستجوی گفتگو" oninput="chatSearch(this.value)"></div><div id="chatList" class="chatList"></div></section>
<section id="profile" class="page"><div class="profile"><div class="profileTop"><img class="big" src="profile.jpg"><div><h2 style="margin:0">امیررضا غلامی</h2><p class="muted" style="margin:5px 0">@amirrezagholami</p><div class="stats"><div><b id="pc">0</b><small>Posts</small></div><div><b id="fc">0</b><small>Followers</small></div><div><b>0</b><small>Following</small></div></div></div></div><div class="bio">Creator • Developer • Dreamer<br>Personal Space • v500.0.0</div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" style="margin:0" onclick="toast('ویرایش پروفایل در نسخه محلی آماده است')">Edit Profile</button><button class="primary" style="margin:0;background:#222" onclick="toast('Profile link copied')">Share</button></div></div><div class="tabs"><button class="sel">Posts</button><button>Reels</button><button>Saved</button></div><div id="profileGrid" class="grid"></div></section>
<section id="notify" class="page"><div class="profile"><h2>Notifications</h2><div id="notifications"></div></div></section>
<section id="settings" class="page"><div class="profile"><h2>Settings</h2><div class="settingsRow"><svg><use href="#globe"/></svg><span>Language</span><div class="lang"><button id="fa" onclick="setLang('fa')">فارسی</button><button id="en" onclick="setLang('en')">EN</button></div></div><div class="settingsRow"><svg><use href="#moon"/></svg><span>Dark mode</span><b>ON</b></div><div class="settingsRow" onclick="openCreate()"><svg><use href="#plus"/></svg><span>Create content</span><b>›</b></div><div class="settingsRow"><svg><use href="#lock"/></svg><span>Privacy</span><b>›</b></div><div class="settingsRow"><svg><use href="#bell"/></svg><span>Notifications</span><b>›</b></div><div class="settingsRow"><svg><use href="#info"/></svg><span>About</span><b>v500.0.0</b></div><div class="settingsRow danger" onclick="clearData()"><span>Reset local data</span><b>›</b></div></div></section>
<section id="chat" class="chatPage"><div class="chatHead"><button class="ico" onclick="go('direct')"><svg><use href="#back"/></svg></button><img id="chatAvatar" src="profile.jpg"><div style="flex:1"><b id="chatName">Chat</b><small class="muted" style="display:block">Local conversation</small></div><button class="ico"><svg><use href="#info"/></svg></button></div><div id="messages" class="messages"></div><div class="composer"><button class="ico"><svg><use href="#image"/></svg></button><input id="msg" placeholder="پیام..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="sendbtn" onclick="sendMsg()"><svg width="21"><use href="#send"/></svg></button></div></section>
</main>
<nav class="nav"><button onclick="go('home')"><svg><use href="#homeIcon"/></svg></button><button onclick="go('explore')"><svg><use href="#search"/></svg></button><button onclick="openCreate()"><svg><use href="#plus"/></svg></button><button onclick="go('direct')"><svg><use href="#send"/></svg></button><button onclick="go('profile')"><svg><use href="#user"/></svg></button></nav></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="mt">Create</h3><button class="ico" onclick="closeModal()"><svg><use href="#close"/></svg></button></div><textarea id="postText" class="field" rows="5" placeholder="کپشن / Caption"></textarea><input id="postImage" class="field" placeholder="Image URL (اختیاری)"><button class="primary" onclick="publish()">Publish</button></div></div><div id="toast" class="toast"></div>
<svg style="display:none"><defs>
<symbol id="homeIcon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol><symbol id="plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5-8.8 10.2-8.8 10.2S3.2 13.8 3.2 8.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8z"/></symbol><symbol id="comment" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H5l-2 2 .7-4A8 8 0 1 1 20 11.5z"/></symbol><symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol><symbol id="save" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol><symbol id="gear" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="m19.4 15 .1.1-1.7 3-1.4-.6a8 8 0 0 1-2.1 1.2L14 20h-4l-.3-1.3a8 8 0 0 1-2.1-1.2l-1.4.6-1.7-3 .1-.1 1.1-.9a8 8 0 0 1 0-2.2l-1.1-.9-.1-.1 1.7-3 1.4.6a8 8 0 0 1 2.1-1.2L10 4h4l.3 1.3a8 8 0 0 1 2.1 1.2l1.4-.6 1.7 3-.1.1-1.1.9a8 8 0 0 1 0 2.2z"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol><symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol><symbol id="moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></symbol><symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 4 4 2-2 5 4"/></symbol>
</defs></svg>
<script>
const KEY='amirreza_space_v24';let S=JSON.parse(localStorage.getItem(KEY)||'{}');S.posts=S.posts||[];S.notifications=S.notifications||[];S.chats=S.chats||[{id:'amirreza',name:'امیررضا غلامی',handle:'@amirrezagholami',avatar:'profile.jpg',messages:[]}];S.followers=S.followers||0;S.lang=S.lang||'fa';save();
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function go(id){document.querySelectorAll('.page,.chatPage').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active');render();scrollTo(0,0)}
function render(){const p=S.posts;document.getElementById('stories').innerHTML=['امیررضا','دوستان','Close Friends','Reels'].map((x,i)=>`<div class="story"><img class="avatar" src="profile.jpg"><small>${x}</small></div>`).join('');document.getElementById('feed').innerHTML=p.length?p.map(postHTML).join(''):`<div class="empty"><h2>Welcome to v500</h2><p>هنوز پستی ساخته نشده. از + شروع کن.</p></div>`;document.getElementById('exploreGrid').innerHTML=p.length?p.map(x=>`<img class="tile" src="${esc(x.image||'https://picsum.photos/500?random='+x.id)}">`).join(''):`<div class="empty" style="grid-column:1/-1">Explore آماده است</div>`;document.getElementById('profileGrid').innerHTML=p.map(x=>`<img class="tile" src="${esc(x.image||'https://picsum.photos/500?random='+x.id)}">`).join('');document.getElementById('pc').textContent=p.length;document.getElementById('fc').textContent=S.followers;document.getElementById('notifications').innerHTML=S.notifications.length?S.notifications.map(n=>`<div class="note">${esc(n)}</div>`).join(''):`<div class="empty">No notifications</div>`;renderChats();document.getElementById('reelsBox').innerHTML=p.length?`<div class="reel"><img src="${esc(p[0].image||'https://picsum.photos/700/1100?random='+p[0].id)}"><div class="reelInfo"><b>@amirrezagholami</b><div>${esc(p[0].text||'Reel')}</div></div><div class="reelActions"><button onclick="like(${p[0].id})"><svg><use href="#heart"/></svg><small>${p[0].likes||0}</small></button><button onclick="toast('Comments opened')"><svg><use href="#comment"/></svg></button><button onclick="share(${p[0].id})"><svg><use href="#send"/></svg></button></div></div>`:`<div class="empty">Reels آماده است</div>`}
function postHTML(p){return `<article class="card"><div class="phead"><img src="profile.jpg"><div class="pmeta"><b>amirrezagholami</b><small>امیررضا غلامی · ${esc(p.time)}</small></div><button class="ico" onclick="toast('Post options')">•••</button></div><img class="media" src="${esc(p.image||'https://picsum.photos/700?random='+p.id)}" ondblclick="like(${p.id})"><div class="actions"><button class="ico" onclick="like(${p.id})"><svg><use href="#heart"/></svg></button><button class="ico" onclick="toast('Comments')"><svg><use href="#comment"/></svg></button><button class="ico" onclick="share(${p.id})"><svg><use href="#send"/></svg></button><button class="ico push" onclick="savePost(${p.id})"><svg><use href="#save"/></svg></button></div><div class="count"><b>${p.likes||0} likes</b></div><div class="caption"><b>amirrezagholami</b> ${esc(p.text||'')}</div></article>`}
function openCreate(){document.getElementById('modal').classList.add('show');document.getElementById('postText').focus()}function closeModal(){document.getElementById('modal').classList.remove('show')}function publish(){const text=document.getElementById('postText').value.trim(),image=document.getElementById('postImage').value.trim();if(!text&&!image)return toast('یک متن یا تصویر وارد کن');S.posts.unshift({id:Date.now(),text,image,likes:0,time:new Date().toLocaleString('fa-IR')});S.notifications.unshift('پست جدید شما منتشر شد');save();closeModal();render();go('home');toast('Published ✓')}
function like(id){let p=S.posts.find(x=>x.id===id);if(p){p.likes=(p.likes||0)+1;save();render()}}function savePost(id){S.saved=S.saved||[];S.saved.push(id);save();toast('Saved ✓')}function share(id){const p=S.posts.find(x=>x.id===id);if(p){navigator.clipboard?.writeText(location.href+'#post-'+id);toast('Link copied')}}function search(v){v=v.toLowerCase();document.getElementById('exploreGrid').innerHTML=S.posts.filter(p=>(p.text||'').toLowerCase().includes(v)).map(x=>`<img class="tile" src="${esc(x.image||'https://picsum.photos/500?random='+x.id)}">`).join('')||'<div class="empty" style="grid-column:1/-1">نتیجه‌ای پیدا نشد</div>'}
function renderChats(filter=''){const arr=S.chats.filter(c=>(c.name+c.handle).toLowerCase().includes(filter.toLowerCase()));document.getElementById('chatList').innerHTML=arr.map(c=>`<div class="chat" onclick="openChat('${c.id}')"><img src="${esc(c.avatar)}"><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.messages.at(-1)?.text||'شروع گفتگو')}</small></div><small>${esc(c.messages.at(-1)?.time||'')}</small></div>`).join('')||'<div class="empty">گفتگویی وجود ندارد</div>'}function chatSearch(v){renderChats(v)}let currentChat=null;function openChat(id){currentChat=S.chats.find(c=>c.id===id);if(!currentChat)return;document.getElementById('chatName').textContent=currentChat.name;document.getElementById('chatAvatar').src=currentChat.avatar;go('chat');renderMessages()}function renderMessages(){document.getElementById('messages').innerHTML=currentChat.messages.length?currentChat.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${esc(m.time)}</small></div>`).join(''):`<div class="empty">هنوز پیامی نیست</div>`;const el=document.getElementById('messages');el.scrollTop=el.scrollHeight}function sendMsg(){const el=document.getElementById('msg'),text=el.value.trim();if(!text||!currentChat)return;currentChat.messages.push({text,mine:true,time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})});S.notifications.unshift('پیام شما در Direct ذخیره شد');save();el.value='';renderMessages();}
function setLang(l){S.lang=l;save();document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';document.getElementById('fa').classList.toggle('sel',l==='fa');document.getElementById('en').classList.toggle('sel',l==='en');toast(l==='fa'?'زبان فارسی':'English selected')}function clearData(){if(confirm('پاک کردن اطلاعات محلی؟')){localStorage.removeItem(KEY);location.reload()}}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}setLang(S.lang);render();
</script></body></html>
