<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>AMIRREZA • v500.0.0</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080808;color:#f5f5f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}img{max-width:100%}
:root{--b:#080808;--s:#111;--s2:#181818;--l:#292929;--m:#8b8b8b;--a:#0095f6;--r:#ff3040}
.app{width:min(620px,100%);margin:auto;min-height:100vh;background:#000;padding-bottom:64px}
.top{height:58px;border-bottom:1px solid #202020;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px}.version{font-size:9px;color:#666;margin-right:6px}
.svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.actions{display:flex;gap:14px}.iconbtn{background:none;border:0;padding:4px}
.page{display:none}.page.active{display:block}
.stories{display:flex;gap:14px;padding:14px 11px;overflow:auto;border-bottom:1px solid #1c1c1c}.story{min-width:63px;text-align:center;color:#aaa;font-size:11px}.story img{width:59px;height:59px;border-radius:50%;object-fit:cover;padding:2px;border:2px solid #d62976}.your{position:relative}.plus{position:absolute;right:4px;bottom:18px;width:18px;height:18px;border:2px solid #000;border-radius:50%;background:#0095f6;display:grid;place-items:center;font-weight:900}
.post{border-bottom:1px solid #202020}.posthead{height:57px;padding:8px 13px;display:flex;align-items:center;gap:10px}.posthead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.name{font-weight:750;font-size:14px}.muted{color:#777;font-size:11px}.more{margin-right:auto}
.postimage{display:block;width:100%;max-height:700px;object-fit:cover;background:#111}.caption{padding:9px 13px;line-height:1.8;font-size:14px}.tools{display:flex;gap:14px;padding:8px 11px 2px}.tools .save{margin-right:auto}.liked{color:var(--r)!important}.saved{color:#fff!important}.meta{padding:0 13px 12px;font-size:12px;color:#777}.meta b{color:#eee}
.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:61px;background:#000;border-top:1px solid #252525;display:flex;justify-content:space-around;align-items:center}.nav button{border:0;background:none}.nav .active{color:#00d9ff}.createbtn{width:35px;height:35px;border:1px solid #777!important;border-radius:9px!important}
.search{padding:13px}.search input{width:100%;background:#181818;border:0;border-radius:11px;color:#fff;padding:12px 14px;outline:none}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.explore img{width:100%;aspect-ratio:1;object-fit:cover}.result{padding:15px;border-bottom:1px solid #222}
.profile{padding:25px 17px}.profiletop{display:flex;gap:20px;align-items:center}.profiletop img{width:88px;height:88px;border-radius:50%;object-fit:cover}.stats{display:flex;gap:21px;text-align:center}.stats b{display:block;font-size:17px}.stats span{font-size:11px;color:#888}.bio{margin-top:15px;font-size:13px;line-height:1.8}.profilebuttons{display:flex;gap:7px;margin-top:15px}.profilebuttons button{flex:1;background:#181818;border:1px solid #292929;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:22px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}
.reels{height:calc(100vh - 61px);overflow:auto;scroll-snap-type:y mandatory}.reel{height:calc(100vh - 61px);scroll-snap-align:start;position:relative;background:#090909}.reel>img{width:100%;height:100%;object-fit:cover;opacity:.9}.reelinfo{position:absolute;right:14px;bottom:28px;left:75px;text-shadow:0 1px 5px #000}.rail{position:absolute;left:12px;bottom:25px;display:grid;gap:15px}.rail button{background:#111b;border:0;border-radius:50%;padding:9px}
.modal{position:fixed;inset:0;background:#000c;display:none;z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(620px,100%);max-height:82vh;overflow:auto;background:#111;border-radius:18px 18px 0 0;margin:auto auto 0;padding:18px}.sheettop{display:flex;align-items:center;justify-content:space-between}.sheet textarea,.sheet input{width:100%;margin:7px 0;background:#181818;border:1px solid #292929;color:#fff;border-radius:9px;padding:11px;outline:0}.sheet textarea{height:105px;resize:none}.primary{width:100%;background:#0095f6;border:0;border-radius:9px;padding:11px;font-weight:750;margin-top:7px}
.comments>div{padding:10px 0;border-bottom:1px solid #222}.empty{text-align:center;color:#777;padding:65px 20px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:100;font-size:13px}
.storyview{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center}.storyview.open{display:flex}.storyview img{width:100%;height:100%;object-fit:contain}.close{position:absolute;right:15px;top:15px;background:#111b;border:0;border-radius:50%;padding:8px;z-index:2}
.notify{padding:5px 15px}.notice{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #222}.notice img{width:42px;height:42px;border-radius:50%}
.settings{padding:15px}.setting{padding:17px 5px;border-bottom:1px solid #222;display:flex;justify-content:space-between}.danger{color:#ff4050}
@media(min-width:621px){body{background:#151515}.app{border-left:1px solid #222;border-right:1px solid #222}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A5 5 0 0 1 12 6a5 5 0 0 1 8.8 2.7z"/></symbol>
<symbol id="comment" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-3.8-.9L4 20l1.4-3.5A8 8 0 1 1 20 11.5z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.5-7-7-3.5zM10 14l5-5"/></symbol>
<symbol id="save" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><path d="M12 2l1.4 2.3 2.7.5 2-1.4 1.7 1.7-1.4 2 .5 2.7L21 11v2l-2.1 1.2-.5 2.7 1.4 2-1.7 1.7-2-1.4-2.7.5L12 22l-1.2-2.3-2.7-.5-2 1.4-1.7-1.7 1.4-2-.5-2.7L3 13v-2l2.3-1.2.5-2.7-1.4-2 1.7-1.7 2 1.4 2.7-.5z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<div class="app">

<header class="top">
<div class="logo">AMIRREZA <span class="version">v500.0.0</span></div>
<div class="actions">
<button class="iconbtn" onclick="openModal('create')"><svg class="svg"><use href="#plus"/></svg></button>
<button class="iconbtn" onclick="page('notify',this)"><svg class="svg"><use href="#bell"/></svg></button>
<button class="iconbtn" onclick="page('settings',this)"><svg class="svg"><use href="#gear"/></svg></button>
</div>
</header>

<section id="home" class="page active">
<div class="stories">
<div class="story your" onclick="openStory()"><img src="profile.jpg"><span class="plus">+</span><div>داستان شما</div></div>
<div class="story" onclick="openStory()"><img src="profile.jpg"><div>Amirreza</div></div>
<div class="story" onclick="openStory()"><img src="profile.jpg"><div>Friends</div></div>
<div class="story" onclick="openStory()"><img src="profile.jpg"><div>Today</div></div>
</div>
<div id="feed"></div>
</section>

<section id="explore" class="page">
<div class="search"><input oninput="search(this.value)" placeholder="جستجو در AMIRREZA..."></div>
<div id="exploreGrid" class="explore"></div><div id="results"></div>
</section>

<section id="reels" class="page"><div id="reelsBox" class="reels"></div></section>

<section id="profile" class="page">
<div class="profile">
<div class="profiletop">
<img src="profile.jpg">
<div class="stats">
<div><b id="postCount">0</b><span>پست</span></div>
<div><b id="followers">0</b><span>دنبال‌کننده</span></div>
<div><b id="following">0</b><span>دنبال‌شونده</span></div>
</div>
</div>
<h3>امیررضا غلامی</h3>
<div class="muted">@amirrezagholami</div>
<div class="bio">Creator • Developer • Dreamer<br>Welcome to my personal social space.</div>
<div class="profilebuttons"><button onclick="follow()">دنبال کردن</button><button onclick="toast('ویرایش پروفایل در نسخه Local فعال است')">ویرایش پروفایل</button></div>
<div id="grid" class="grid"></div>
</div>
</section>

<section id="notify" class="page">
<div class="notify" id="notifications"></div>
</section>

<section id="settings" class="page">
<div class="settings">
<div class="setting">حالت شب <span>فعال</span></div>
<div class="setting" onclick="clearData()">پاک‌کردن داده‌های محلی <span class="danger">حذف</span></div>
<div class="setting">نسخه <span>500.0.0</span></div>
</div>
</section>

</div>

<nav class="nav">
<button onclick="page('home',this)" class="active"><svg class="svg"><use href="#home"/></svg></button>
<button onclick="page('explore',this)"><svg class="svg"><use href="#search"/></svg></button>
<button class="createbtn" onclick="openModal('create')"><svg class="svg"><use href="#plus"/></svg></button>
<button onclick="page('reels',this)"><svg class="svg"><use href="#play"/></svg></button>
<button onclick="page('profile',this)"><svg class="svg"><use href="#user"/></svg></button>
</nav>

<div id="create" class="modal"><div class="sheet">
<div class="sheettop"><h3>پست جدید</h3><button class="iconbtn" onclick="closeModal('create')"><svg class="svg"><use href="#close"/></svg></button></div>
<textarea id="postText" placeholder="چه چیزی در ذهنته؟"></textarea>
<input id="postFile" type="file" accept="image/*">
<button class="primary" onclick="publish()">انتشار پست</button>
</div></div>

<div id="commentsModal" class="modal"><div class="sheet">
<div class="sheettop"><h3>نظرات</h3><button class="iconbtn" onclick="closeModal('commentsModal')"><svg class="svg"><use href="#close"/></svg></button></div>
<div id="comments" class="comments"></div>
<input id="commentText" placeholder="نظر خود را بنویسید...">
<button class="primary" onclick="addComment()">ارسال</button>
</div></div>

<div id="storyView" class="storyview"><button class="close" onclick="closeModal('storyView')"><svg class="svg"><use href="#close"/></svg></button><img src="profile.jpg"></div>

<script>
const KEY="amirreza_space_v24";
let S=JSON.parse(localStorage.getItem(KEY)||"{}");
S.posts=S.posts||[];S.followers=S.followers||0;S.follow=S.follow||false;S.saved=S.saved||{};S.notifications=S.notifications||[];
let currentPost=null;

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const icon=x=>`<svg class="svg"><use href="#${x}"/></svg>`;

function page(id,b){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
if(b)b.classList.add("active");
render();
}

function render(){
const posts=S.posts.slice().reverse();
document.getElementById("feed").innerHTML=posts.length?posts.map(p=>`
<article class="post" ondblclick="like(${p.id})">
<div class="posthead">
<img src="profile.jpg">
<div><div class="name">امیررضا غلامی</div><div class="muted">@amirrezagholami</div></div>
<button class="iconbtn more" onclick="toast('منوی پست')">•••</button>
</div>
${p.image?`<img class="postimage" src="${p.image}">`:""}
${p.text?`<div class="caption">${esc(p.text)}</div>`:""}
<div class="tools">
<button class="iconbtn ${p.liked?'liked':''}" onclick="like(${p.id})">${icon("heart")}</button>
<button class="iconbtn" onclick="openComments(${p.id})">${icon("comment")}</button>
<button class="iconbtn" onclick="sharePost(${p.id})">${icon("send")}</button>
<button class="iconbtn save ${S.saved[p.id]?'saved':''}" onclick="bookmark(${p.id})">${icon("save")}</button>
</div>
<div class="meta"><b>${p.likes||0} پسند</b> · ${p.time||"همین الان"}</div>
</article>`).join(""):`<div class="empty">هنوز پستی منتشر نشده.<br>اولین پست خودت را بساز.</div>`;

document.getElementById("postCount").textContent=S.posts.length;
document.getElementById("followers").textContent=S.followers;
document.getElementById("following").textContent=S.follow?1:0;

document.getElementById("grid").innerHTML=S.posts.filter(p=>p.image).map(p=>`<img src="${p.image}" onclick="viewPost(${p.id})">`).join("");

document.getElementById("exploreGrid").innerHTML=S.posts.filter(p=>p.image).map(p=>`<img src="${p.image}" onclick="viewPost(${p.id})">`).join("");

document.getElementById("reelsBox").innerHTML=S.posts.filter(p=>p.image).map(p=>`
<div class="reel">
<img src="${p.image}">
<div class="reelinfo"><b>@amirrezagholami</b><br>${esc(p.text||"")}</div>
<div class="rail">
<button onclick="like(${p.id})">${icon("heart")}</button>
<button onclick="openComments(${p.id})">${icon("comment")}</button>
<button onclick="sharePost(${p.id})">${icon("send")}</button>
</div>
</div>`).join("")||`<div class="empty">هنوز محتوای تصویری برای Reels وجود ندارد.</div>`;

document.getElementById("notifications").innerHTML=S.notifications.length?
S.notifications.slice().reverse().map(n=>`<div class="notice"><img src="profile.jpg"><div>${esc(n)}</div></div>`).join("")
:`<div class="empty">اعلان جدیدی نداری.</div>`;

save();
}

function publish(){
const text=document.getElementById("postText").value.trim();
const file=document.getElementById("postFile").files[0];
if(!text&&!file)return toast("چیزی برای انتشار وارد کن");
const finish=image=>{
S.posts.push({id:Date.now(),text,image:image||"",likes:0,liked:false,comments:[],time:"همین الان"});
S.notifications.push("پست جدید شما منتشر شد");
save();document.getElementById("postText").value="";document.getElementById("postFile").value="";
closeModal("create");page("home",document.querySelector(".nav button"));toast("پست منتشر شد");
};
if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish("");
}

function like(id){
const p=S.posts.find(x=>x.id===id);if(!p)return;
p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);
if(p.liked)S.notifications.push("پست شما یک پسند جدید دریافت کرد");
render();
}

function bookmark(id){
S.saved[id]=!S.saved[id];toast(S.saved[id]?"ذخیره شد":"از ذخیره‌ها حذف شد");render();
}

function follow(){
S.follow=!S.follow;S.followers+=S.follow?1:-1;
S.notifications.push(S.follow?"یک نفر شما را دنبال کرد":"دنبال کردن لغو شد");
render();toast(S.follow?"دنبال شد":"لغو شد");
}

function openComments(id){
currentPost=id;const p=S.posts.find(x=>x.id===id);
document.getElementById("comments").innerHTML=(p.comments||[]).map(c=>`<div><b>امیررضا</b><br>${esc(c)}</div>`).join("")||`<div class="empty" style="padding:25px">هنوز نظری وجود ندارد.</div>`;
openModal("commentsModal");
}

function addComment(){
const input=document.getElementById("commentText"),v=input.value.trim();
const p=S.posts.find(x=>x.id===currentPost);
if(!v||!p)return;
p.comments=p.comments||[];p.comments.push(v);
S.notifications.push("یک نظر جدید روی پست شما ثبت شد");
input.value="";save();openComments(currentPost);
}

function search(q){
q=q.toLowerCase().trim();
const a=S.posts.filter(p=>(p.text||"").toLowerCase().includes(q));
document.getElementById("results").innerHTML=q?a.map(p=>`<div class="result">${esc(p.text||"پست تصویری")}</div>`).join("")||`<div class="empty">نتیجه‌ای پیدا نشد.</div>`:"";
}

function sharePost(id){
const url=location.href+"#post-"+id;
if(navigator.share)navigator.share({title:"AMIRREZA",text:"یک پست از AMIRREZA",url}).catch(()=>{});
else navigator.clipboard?.writeText(url);
toast("لینک پست آماده شد");
}

function viewPost(id){
const p=S.posts.find(x=>x.id===id);if(!p)return;
if(p.image){document.querySelector("#storyView img").src=p.image;openModal("storyView")}
}

function openStory(){openModal("storyView")}
function openModal(id){document.getElementById(id).classList.add("open")}
function closeModal(id){document.getElementById(id).classList.remove("open")}

function clearData(){
if(confirm("تمام اطلاعات محلی سایت حذف شود؟")){
localStorage.removeItem(KEY);location.reload();
}
}

function toast(text){
let x=document.querySelector(".toast");
if(!x){x=document.createElement("div");x.className="toast";document.body.appendChild(x)}
x.textContent=text;x.style.display="block";
clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1800);
}

render();
</script>
</body>
 </html>
