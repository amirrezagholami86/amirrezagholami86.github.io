<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>AMIRREZA • v5.0.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{max-width:600px;margin:auto;min-height:100vh;background:#000}
header{height:58px;border-bottom:1px solid #262626;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#000;z-index:10}
.logo{font-size:21px;font-weight:800;letter-spacing:-1px}.ver{font-size:9px;color:#666;margin-right:6px}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;gap:18px;align-items:center}.btn{background:none;border:0;padding:4px}
.page{display:none}.page.on{display:block}
.stories{display:flex;gap:14px;padding:15px 12px;overflow:auto;border-bottom:1px solid #181818}
.story{min-width:62px;text-align:center;font-size:11px;color:#aaa}.avatar{width:58px;height:58px;border-radius:50%;padding:2px;border:2px solid #d62976;object-fit:cover}.story:first-child .avatar{border-color:#444}
.post{border-bottom:1px solid #222}.posthead{display:flex;align-items:center;gap:10px;padding:10px 13px}.posthead img{width:38px;height:38px;border-radius:50%;object-fit:cover}.name{font-weight:700;font-size:14px}.handle{font-size:11px;color:#777}.more{margin-right:auto}
.postimg{width:100%;display:block;max-height:650px;object-fit:cover;background:#111}.posttext{padding:10px 13px;font-size:14px;line-height:1.8}
.posttools{display:flex;padding:9px 12px 2px;gap:16px}.posttools .save{margin-right:auto}.liked{color:#ff3040!important}.saved{color:#fff}
.meta{padding:0 13px 13px;color:#888;font-size:12px}.count{font-weight:700;color:#eee;margin-bottom:5px}
.empty{text-align:center;color:#777;padding:80px 20px}
.searchbox{padding:14px}.searchbox input{width:100%;background:#171717;border:0;border-radius:10px;padding:12px 15px;color:#fff;outline:0}
.profile{padding:25px 18px}.profiletop{display:flex;align-items:center;gap:20px}.profiletop img{width:86px;height:86px;border-radius:50%;object-fit:cover}.stats{display:flex;gap:22px;text-align:center}.stats b{display:block;font-size:17px}.stats span{font-size:11px;color:#888}.bio{margin-top:20px;font-size:14px;line-height:1.8}.profileBtns{display:flex;gap:8px;margin-top:16px}.profileBtns button{flex:1;border:1px solid #333;background:#171717;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:25px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#111}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);height:58px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:20}.bottom button{background:none;border:0}.bottom .active{color:#00d9ff}.create{width:34px;height:34px;border:1px solid #aaa!important;border-radius:10px!important;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:30}.modal.on{display:flex}.sheet{background:#111;width:100%;max-width:600px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:18px}.sheet h3{margin:0 0 15px}.sheet textarea{width:100%;height:110px;background:#181818;border:1px solid #292929;color:#fff;border-radius:10px;padding:12px;outline:0;resize:none}.sheet input{width:100%;background:#181818;border:1px solid #292929;color:#fff;border-radius:10px;padding:11px;margin:8px 0;outline:0}.primary{width:100%;background:#0095f6;border:0;border-radius:9px;padding:11px;margin-top:10px;font-weight:700}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #222}.comment img{width:32px;height:32px;border-radius:50%}
@media(min-width:601px){body{background:#101010}.app{border-left:1px solid #222;border-right:1px solid #222}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A5 5 0 0 1 12 6a5 5 0 0 1 8.8 2.7z"/></symbol>
<symbol id="comment" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-3.8-.9L4 20l1.4-3.5A8 8 0 1 1 20 11.5z"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.5-7-7-3.5zM10 14l5-5"/></symbol>
<symbol id="save" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
</svg>

<div class="app">
<header>
  <div class="logo">AMIRREZA <span class="ver">v5.0</span></div>
  <div class="actions">
    <button class="btn" onclick="openCreate()"><svg class="icon"><use href="#plus"/></svg></button>
    <button class="btn" onclick="toast('اعلان جدیدی نیست')"><svg class="icon"><use href="#bell"/></svg></button>
  </div>
</header>

<main>
<section id="home" class="page on">
<div class="stories">
  <div class="story"><img class="avatar" src="profile.jpg"><div>داستان شما</div></div>
  <div class="story"><img class="avatar" src="profile.jpg"><div>Amirreza</div></div>
  <div class="story"><img class="avatar" src="profile.jpg"><div>Friends</div></div>
  <div class="story"><img class="avatar" src="profile.jpg"><div>Today</div></div>
</div>
<div id="feed"></div>
</section>

<section id="searchPage" class="page">
<div class="searchbox"><input id="search" placeholder="جستجو" oninput="searchPosts(this.value)"></div>
<div id="results"></div>
</section>

<section id="profile" class="page">
<div class="profile">
<div class="profiletop">
<img src="profile.jpg">
<div class="stats">
<div><b id="pPosts">0</b><span>پست</span></div>
<div><b id="pFollowers">0</b><span>دنبال‌کننده</span></div>
<div><b id="pFollowing">0</b><span>دنبال‌شونده</span></div>
</div>
</div>
<h3>امیررضا غلامی</h3>
<div>@amirrezagholami</div>
<div class="bio">Creator • Developer • Dreamer<br>Personal space of Amirreza.</div>
<div class="profileBtns"><button onclick="follow()">دنبال کردن</button><button>ویرایش پروفایل</button></div>
<div class="grid" id="grid"></div>
</div>
</section>
</main>
</div>

<nav class="bottom">
<button onclick="go('home')" class="active"><svg class="icon"><use href="#home"/></svg></button>
<button onclick="go('searchPage')"><svg class="icon"><use href="#search"/></svg></button>
<button class="create" onclick="openCreate()"><svg class="icon"><use href="#plus"/></svg></button>
<button onclick="toast('پیام‌ها به‌زودی')"><svg class="icon"><use href="#send"/></svg></button>
<button onclick="go('profile')"><svg class="icon"><use href="#user"/></svg></button>
</nav>

<div id="createModal" class="modal">
<div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>پست جدید</h3><button class="btn" onclick="closeCreate()"><svg class="icon"><use href="#x"/></svg></button>
</div>
<textarea id="postText" placeholder="چه چیزی در ذهنته؟"></textarea>
<input type="file" id="postImage" accept="image/*">
<button class="primary" onclick="publish()">انتشار</button>
</div>
</div>

<div id="commentModal" class="modal">
<div class="sheet">
<div style="display:flex;justify-content:space-between"><h3>نظرات</h3><button class="btn" onclick="closeComments()"><svg class="icon"><use href="#x"/></svg></button></div>
<div id="comments"></div>
<input id="commentInput" placeholder="نظر خود را بنویسید...">
<button class="primary" onclick="sendComment()">ارسال</button>
</div>
</div>

<script>
const K="amirreza_space_v24";
let S=JSON.parse(localStorage.getItem(K)||"{}");
S.posts=S.posts||[];S.followers=S.followers||0;S.follow=S.follow||false;S.saved=S.saved||{};
let currentPost=null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const esc=x=>String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));render()}
function render(){
 let f=document.getElementById("feed");
 f.innerHTML=S.posts.length?S.posts.slice().reverse().map(p=>`
 <article class="post">
 <div class="posthead"><img src="profile.jpg"><div><div class="name">امیررضا غلامی</div><div class="handle">@amirrezagholami</div></div><button class="btn more">•••</button></div>
 ${p.image?`<img class="postimg" src="${p.image}">`:""}
 ${p.text?`<div class="posttext">${esc(p.text)}</div>`:""}
 <div class="posttools">
 <button class="btn ${p.liked?'liked':''}" onclick="like(${p.id})"><svg class="icon"><use href="#heart"/></svg></button>
 <button class="btn" onclick="openComments(${p.id})"><svg class="icon"><use href="#comment"/></svg></button>
 <button class="btn"><svg class="icon"><use href="#send"/></svg></button>
 <button class="btn save ${S.saved[p.id]?'saved':''}" onclick="bookmark(${p.id})"><svg class="icon"><use href="#save"/></svg></button>
 </div>
 <div class="meta"><div class="count">${p.likes||0} پسند</div>${p.time||"همین الان"}</div>
 </article>`).join(""):`<div class="empty">هنوز پستی منتشر نشده<br>اولین پست را خودت بساز.</div>`;
 document.getElementById("pPosts").textContent=S.posts.length;
 document.getElementById("pFollowers").textContent=S.followers;
 document.getElementById("pFollowing").textContent=S.follow?1:0;
 document.getElementById("grid").innerHTML=S.posts.map(p=>p.image?`<img src="${p.image}">`:"").join("");
 save();
}
function like(id){let p=S.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);render()}
function bookmark(id){S.saved[id]=!S.saved[id];render()}
function follow(){S.follow=!S.follow;S.followers+=S.follow?1:-1;render();toast(S.follow?"دنبال شد":"لغو دنبال کردن")}
function openCreate(){document.getElementById("createModal").classList.add("on")}
function closeCreate(){document.getElementById("createModal").classList.remove("on")}
function publish(){
 let text=document.getElementById("postText").value.trim(),file=document.getElementById("postImage").files[0];
 if(!text&&!file)return toast("چیزی برای انتشار وارد کن");
 const add=img=>{S.posts.push({id:Date.now(),text,image:img||"",likes:0,liked:false,comments:[],time:"همین الان"});save();document.getElementById("postText").value="";document.getElementById("postImage").value="";closeCreate();go("home");toast("پست منتشر شد")};
 if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add("");
}
function openComments(id){currentPost=id;let p=S.posts.find(x=>x.id===id);document.getElementById("comments").innerHTML=(p.comments||[]).map(c=>`<div class="comment"><img src="profile.jpg"><div><b>امیررضا</b><br>${esc(c)}</div></div>`).join("")||'<div class="empty" style="padding:25px">هنوز نظری ثبت نشده</div>';document.getElementById("commentModal").classList.add("on")}
function closeComments(){document.getElementById("commentModal").classList.remove("on")}
function sendComment(){let i=document.getElementById("commentInput"),v=i.value.trim();if(!v)return;let p=S.posts.find(x=>x.id===currentPost);p.comments=p.comments||[];p.comments.push(v);i.value="";openComments(currentPost);save()}
function searchPosts(q){q=q.toLowerCase();document.getElementById("results").innerHTML=S.posts.filter(p=>(p.text||"").toLowerCase().includes(q)).map(p=>`<div class="posttext">${esc(p.text)}</div>`).join("")||'<div class="empty">نتیجه‌ای پیدا نشد</div>'}
function toast(t){let x=document.getElementById("toast");if(!x){x=document.createElement("div");x.id="toast";x.style="position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 18px;border-radius:10px;z-index:99;font-size:13px";document.body.appendChild(x)}x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
render();
</script>
</body>
</html>
